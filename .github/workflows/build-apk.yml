name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Repository Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python 3.11
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux Dependencies
      # ==========================================
      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # ==========================================
      # 5. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install cython==0.29.36

      # ==========================================
      # 6. Install Android SDK Command Line Tools
      # ==========================================
      - name: Install Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK/cmdline-tools"

          rm -rf "$SDK/cmdline-tools/latest"

          mv cmdline-tools "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/tools"

          ln -sfn \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/bin"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

          echo "Checking sdkmanager..."

          "$SDK/tools/bin/sdkmanager" --version

      # ==========================================
      # 7. Accept Android SDK Licenses
      # ==========================================
      - name: Accept Android SDK Licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$SDK/licenses/android-sdk-license"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$SDK/licenses/android-sdk-license"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            >> "$SDK/licenses/android-sdk-license"

      # ==========================================
      # 8. Build V16 APK
      # ==========================================
      - name: Build V16 APK
        run: |
          buildozer android debug

      # ==========================================
      # 9. Upload APK
      # ==========================================
      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
