name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Java
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux Dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 6. Install Android packages
      # ==========================================
      - name: Install Android packages
        run: |
          sdkmanager --update || true
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      # ==========================================
      # 7. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer

          pip install cython==0.29.36

      # ==========================================
      # 8. Buildozer configuration
      # ==========================================
      - name: Configure Buildozer
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo "Buildozer configuration:"
          grep "android.accept_sdk_license" buildozer.spec || true

      # ==========================================
      # 9. Prepare Buildozer SDK
      # ==========================================
      - name: Prepare Buildozer SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK/tools"

          # Copy GitHub Android SDK
          cp -a "$ANDROID_HOME"/. "$SDK"/

          # Buildozer expects old sdkmanager location
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          # Also expose sdkmanager through PATH
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

          echo "Checking Buildozer sdkmanager..."

          "$SDK/tools/bin/sdkmanager" --version

      # ==========================================
      # 10. Build APK
      # ==========================================
      - name: Build V16 APK
        run: |
          buildozer android debug

      # ==========================================
      # 11. Upload APK
      # ==========================================
      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
