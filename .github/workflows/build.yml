name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux dependencies
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            ccache \
            build-essential

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 6. Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 7. Python build tools
      # ==========================================
      - name: Install Buildozer and Cython
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36"

      # ==========================================
      # 8. Install pinned python-for-android
      # ==========================================
      - name: Install pinned python-for-android
        run: |
          rm -rf "$HOME/python-for-android"

          git clone \
            https://github.com/kivy/python-for-android.git \
            "$HOME/python-for-android"

          cd "$HOME/python-for-android"

          # Stable known commit.
          git checkout 4f7e7f2

          python -m pip install .

          echo "========== P4A VERSION =========="
          python -m pythonforandroid.toolchain --version || true
          echo "================================="

      # ==========================================
      # 9. Configure environment
      # ==========================================
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          python --version
          buildozer --version

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

      # ==========================================
      # 10. Clean old Buildozer files
      # ==========================================
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # ==========================================
      # 11. Check buildozer.spec
      # ==========================================
      - name: Check Buildozer configuration
        run: |
          echo "========== buildozer.spec =========="
          cat buildozer.spec
          echo "===================================="

      # ==========================================
      # 12. Build APK
      # ==========================================
      - name: Build V16 Antivirus APK
        env:
          P4A_HOME: /home/runner/python-for-android
          P4A_PATH: /home/runner/python-for-android
          ANDROIDAPI: "35"
          ANDROIDMINAPI: "23"
        run: |
          buildozer android debug log_level=2

      # ==========================================
      # 13. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          echo "========== APK RESULT =========="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          echo "================================"

      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload V16 Antivirus APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
