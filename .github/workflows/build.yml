name: V16 Antivirus APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V16 Antivirus APK
    runs-on: ubuntu-22.04

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 2. Python 3.11
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==================================================
      # 3. Java 17
      # ==================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==================================================
      # 4. Install Linux dependencies
      # ==================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # ==================================================
      # 5. Locate Android SDK
      # ==================================================
      - name: Configure Android SDK
        shell: bash
        run: |

          SDK_PATH=""

          if [ -d "$ANDROID_HOME" ]; then
            SDK_PATH="$ANDROID_HOME"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_PATH="$ANDROID_SDK_ROOT"
          elif [ -d "$HOME/android-sdk" ]; then
            SDK_PATH="$HOME/android-sdk"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_PATH="/usr/local/lib/android/sdk"
          elif [ -d "/opt/android-sdk" ]; then
            SDK_PATH="/opt/android-sdk"
          fi

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "Android SDK found at:"
          echo "$SDK_PATH"

          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"

          echo "$SDK_PATH/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_PATH/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$SDK_PATH/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"

      # ==================================================
      # 6. Locate sdkmanager
      # ==================================================
      - name: Locate sdkmanager
        shell: bash
        run: |

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Android SDK: $ANDROID_HOME"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager found:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # ==================================================
      # 7. Accept Android licenses
      # ==================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      # ==================================================
      # 8. Install Android SDK components
      # ==================================================
      - name: Install Android SDK components
        shell: bash
        run: |

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==================================================
      # 9. Verify AIDL
      # ==================================================
      - name: Verify Android Build Tools
        shell: bash
        run: |

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "AIDL:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/aidl"

          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL is available."

      # ==================================================
      # 10. Install Python build tools
      # ==================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer cython

      # ==================================================
      # 11. Verify project
      # ==================================================
      - name: Verify project files
        run: |

          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Buildozer spec:"
          test -f buildozer.spec

          echo ""
          echo "Main Python file:"
          test -f V16Antivirus.py

      # ==================================================
      # 12. Build APK
      # ==================================================
      - name: Build Android APK
        shell: bash
        run: |

          yes | buildozer android debug

      # ==================================================
      # 13. Find APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |

          echo "Generated APK files:"

          find bin -type f -name "*.apk" -print

          APK="$(find bin -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      # ==================================================
      # 14. Prepare release APK
      # ==================================================
      - name: Prepare release
        shell: bash
        run: |

          mkdir -p release

          APK="$(find bin -type f -name "*.apk" | head -n 1)"

          cp "$APK" "release/V16-Antivirus-Pro.apk"

          echo "Final APK:"
          ls -lh "release/V16-Antivirus-Pro.apk"

      # ==================================================
      # 15. Upload APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-Pro
          path: release/V16-Antivirus-Pro.apk
          if-no-files-found: error
          retention-days: 30
