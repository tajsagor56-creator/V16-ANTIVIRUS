name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ==========================================
      # 1. Checkout source
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python 3.11
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux dependencies
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            ccache \
            build-essential

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 6. Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 7. Python build tools
      # ==========================================
      - name: Install Buildozer
        run: |
          python --version

          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36"

      # ==========================================
      # 8. Install EXACT python-for-android release
      # ==========================================
      - name: Install pinned python-for-android
        run: |
          rm -rf "$HOME/python-for-android"

          git clone \
            --depth 1 \
            --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$HOME/python-for-android"

          cd "$HOME/python-for-android"

          echo "========== P4A COMMIT =========="
          git rev-parse HEAD
          echo "Expected release commit:"
          echo "957a3e5"
          echo "================================"

          python -m pip install .

          python -c "import pythonforandroid; print('P4A installed successfully')"

      # ==========================================
      # 9. Android environment
      # ==========================================
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          python --version
          buildozer --version

      # ==========================================
      # 10. Clean old Buildozer cache
      # ==========================================
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # ==========================================
      # 11. Show buildozer.spec
      # ==========================================
      - name: Check Buildozer configuration
        run: |
          echo "=========================================="
          echo "BUILDZOZER SPEC"
          echo "=========================================="

          cat buildozer.spec

          echo "=========================================="

      # ==========================================
      # 12. Build APK
      # ==========================================
      - name: Build V16 Antivirus APK
        env:
          ANDROIDAPI: "35"
          ANDROIDMINAPI: "23"
          P4A_HOME: "/home/runner/python-for-android"
          P4A_PATH: "/home/runner/python-for-android"
        run: |
          buildozer android debug log_level=2

      # ==========================================
      # 13. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find bin -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="
          echo "APK: $APK"

      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload V16 Antivirus APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
