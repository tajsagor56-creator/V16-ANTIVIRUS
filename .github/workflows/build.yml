name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout source
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python 3.11
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux dependencies
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev

      # ==========================================
      # 5. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer

          pip install cython==0.29.36

      # ==========================================
      # 6. Create Buildozer Android SDK
      # ==========================================
      - name: Install Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"
          mkdir -p "$SDK/tools/bin"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
            -O android-cmdline-tools.zip

          unzip -q android-cmdline-tools.zip

          mv cmdline-tools "$SDK/cmdline-tools/latest"

          # Buildozer compatibility path
          ln -s \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -s \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

          echo "Checking sdkmanager..."

          "$SDK/tools/bin/sdkmanager" --version

      # ==========================================
      # 7. Accept Android licenses
      # ==========================================
      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$SDK/licenses/android-sdk-license"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$SDK/licenses/android-sdk-license"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            >> "$SDK/licenses/android-sdk-license"

      # ==========================================
      # 8. Install required Android packages
      # ==========================================
      - name: Install Android packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 9. Verify AIDL
      # ==========================================
      - name: Verify Android AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Installed Build Tools:"
          ls -la "$SDK/build-tools"

          echo "Searching for AIDL..."

          find "$SDK/build-tools" \
            -type f \
            -name "aidl" \
            -print

          if [ ! -f "$SDK/build-tools/35.0.0/aidl" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          chmod +x "$SDK/build-tools/35.0.0/aidl"

          echo "AIDL found successfully."

      # ==========================================
      # 10. Configure Buildozer
      # ==========================================
      - name: Configure Buildozer
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo "===== BUILDОZER SPEC ====="
          cat buildozer.spec

      # ==========================================
      # 11. Build APK
      # ==========================================
      - name: Build V16 APK
        run: |
          buildozer android debug

      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
