name: Build V16 Antivirus APK

on:
  workflow_dispatch:

  push:
    branches:
      - main


concurrency:
  group: v16-antivirus-build
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 120


    steps:

      # ==========================================
      # 1. Checkout source
      # ==========================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python
      # ==========================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"


      # ==========================================
      # 3. Setup Java 17
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. Linux dependencies
      # ==========================================

      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            ccache


      # ==========================================
      # 5. Setup Android SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================
      # 6. Install Android SDK
      # ==========================================

      - name: Install Android SDK packages
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 7. Install Buildozer
      # ==========================================

      - name: Install Buildozer
        run: |

          python --version

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36"


      # ==========================================
      # 8. Verify configuration
      # ==========================================

      - name: Verify configuration
        run: |

          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          cat buildozer.spec

          echo "=========================================="

          test -f buildozer.spec


      # ==========================================
      # 9. Clean old files
      # ==========================================

      - name: Clean Buildozer cache
        run: |

          rm -rf .buildozer

          rm -rf bin


      # ==========================================
      # 10. Build APK
      # ==========================================

      - name: Build V16 APK
        run: |

          buildozer -v android debug


      # ==========================================
      # 11. Locate APK
      # ==========================================

      - name: Locate APK
        run: |

          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          find . -type f -name "*.apk" -print

          echo "=========================================="


      # ==========================================
      # 12. Verify APK
      # ==========================================

      - name: Verify APK
        run: |

          APK=$(find bin -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            exit 1

          fi

          echo "APK FOUND:"
          echo "$APK"


      # ==========================================
      # 13. Start Android Emulator
      # ==========================================

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true

        with:

          api-level: 35

          target: google_apis

          arch: x86_64

          profile: pixel_2

          cores: 2

          ram-size: 2048M

          heap-size: 512M

          disk-size: 4096M

          force-avd-creation: true

          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -gpu swiftshader_indirect

          disable-animations: true

          script: |

            echo "=========================================="
            echo "ANDROID EMULATOR TEST"
            echo "=========================================="

            adb wait-for-device

            adb shell getprop ro.build.version.sdk

            echo "=========================================="
            echo "INSTALLING APK"
            echo "=========================================="

            APK=$(find bin -type f -name "*.apk" -print -quit)

            echo "APK:"
            echo "$APK"

            adb install -r "$APK"

            echo "=========================================="
            echo "CLEARING LOGCAT"
            echo "=========================================="

            adb logcat -c

            echo "=========================================="
            echo "STARTING V16 ANTIVIRUS"
            echo "=========================================="

            adb shell monkey \
              -p org.kingtaj.v16antivirus \
              1

            echo "=========================================="
            echo "WAITING FOR APP"
            echo "=========================================="

            sleep 15

            echo "=========================================="
            echo "APP PROCESS"
            echo "=========================================="

            adb shell pidof org.kingtaj.v16antivirus || true

            echo "=========================================="
            echo "CRASH LOG"
            echo "=========================================="

            adb logcat -d > emulator-logcat.txt

            grep -iE \
              "FATAL EXCEPTION|AndroidRuntime|python|kivy|v16antivirus|Traceback|ImportError|ModuleNotFoundError|Unable to start activity" \
              emulator-logcat.txt \
              || true

            echo "=========================================="
            echo "LAST LOGCAT"
            echo "=========================================="

            tail -n 300 emulator-logcat.txt

            echo "=========================================="


      # ==========================================
      # 14. Upload crash log
      # ==========================================

      - name: Upload emulator crash logs
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: V16-Android-Crash-Logs

          path: |
            emulator-logcat.txt

          if-no-files-found: warn


      # ==========================================
      # 15. Upload APK
      # ==========================================

      - name: Upload V16 Antivirus APK
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: V16-Antivirus-APK

          path: bin/*.apk

          if-no-files-found: error
