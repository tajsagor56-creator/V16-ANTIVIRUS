name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-antivirus-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build V16 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Source code
      # --------------------------------------------------
      - name: Checkout V16 Antivirus
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Install Buildozer
      # --------------------------------------------------
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.36"

      # --------------------------------------------------
      # 5. Check project files
      # --------------------------------------------------
      - name: Check V16 project
        run: |
          echo "========== PROJECT FILES =========="
          ls -la
          echo "========== MAIN.PY =========="
          test -f main.py
          echo "main.py found"
          echo "========== BUILDOZER.SPEC =========="
          test -f buildozer.spec
          echo "buildozer.spec found"

      # --------------------------------------------------
      # 6. Force SDK license acceptance
      # --------------------------------------------------
      - name: Configure Android SDK license
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            printf '\nandroid.accept_sdk_license = True\n' >> buildozer.spec
          fi

          echo "SDK license setting:"
          grep "android.accept_sdk_license" buildozer.spec

      # --------------------------------------------------
      # 7. Build V16 APK
      # --------------------------------------------------
      - name: Build V16 Antivirus Debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      # --------------------------------------------------
      # 8. Show generated APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "========== APK FILES =========="
          find bin -maxdepth 1 -type f -name "*.apk" -print

      # --------------------------------------------------
      # 9. Upload APK
      # --------------------------------------------------
      - name: Upload V16 Antivirus APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
