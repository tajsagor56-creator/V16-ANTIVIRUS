name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install cython==0.29.36

      - name: Configure Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK/cmdline-tools"
          mkdir -p "$SDK/tools/bin"

      - name: Install Android Command Line Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
            -O android-cmdline-tools.zip

          rm -rf cmdline-tools

          unzip -q android-cmdline-tools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mv cmdline-tools "$SDK/cmdline-tools/latest"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

          "$SDK/tools/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$SDK/licenses/android-sdk-license"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$SDK/licenses/android-sdk-license"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            >> "$SDK/licenses/android-sdk-license"

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android Build Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Installed Build Tools:"
          ls -la "$SDK/build-tools"

          echo "Searching for AIDL:"

          find "$SDK/build-tools" \
            -type f \
            -name "aidl" \
            -print

          if [ ! -f "$SDK/build-tools/35.0.0/aidl" ]; then
            echo "ERROR: AIDL not found"
            exit 1
          fi

          chmod +x "$SDK/build-tools/35.0.0/aidl"

          echo "AIDL successfully installed."

      - name: Verify V16 configuration
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec

          echo "===== Android configuration ====="

          grep -E \
            "android.api|android.minapi|android.archs|requirements" \
            buildozer.spec

      - name: Configure Buildozer license
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build V16 APK
        run: |
          buildozer android debug

      - name: Check APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/

      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
