name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python 3.11
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev

      # ==========================================
      # 5. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install cython==0.29.36

      # ==========================================
      # 6. Prepare Buildozer configuration
      # ==========================================
      - name: Configure Buildozer
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      # ==========================================
      # 7. Build APK
      # ==========================================
      - name: Build V16 APK
        run: |
          buildozer android debug

      # ==========================================
      # 8. Upload APK
      # ==========================================
      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
