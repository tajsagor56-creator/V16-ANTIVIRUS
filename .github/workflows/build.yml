name: Build V16 Antivirus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: v16-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # ==========================================
      # 3. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Linux dependencies
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            ccache

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 6. Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      # ==========================================
      # 7. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36"

      # ==========================================
      # 8. Pin python-for-android
      # ==========================================
      - name: Install pinned python-for-android
        run: |
          rm -rf "$HOME/python-for-android"

          git clone \
            --depth 1 \
            --branch 2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$HOME/python-for-android"

          cd "$HOME/python-for-android"

          python -m pip install .

          python -m pip show python-for-android

      # ==========================================
      # 9. Configure Buildozer
      # ==========================================
      - name: Configure Buildozer
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo "======================================"
          echo "Python:"
          python --version

          echo "======================================"
          echo "Buildozer:"
          buildozer --version

          echo "======================================"
          echo "Python-for-Android:"
          python -m pythonforandroid.toolchain --version || true

          echo "======================================"
          java -version

      # ==========================================
      # 10. Clean previous Buildozer files
      # ==========================================
      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ==========================================
      # 11. Build APK
      # ==========================================
      - name: Build V16 APK
        run: |
          buildozer android debug log_level=2

      # ==========================================
      # 12. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      # ==========================================
      # 13. Upload APK
      # ==========================================
      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: V16-Antivirus-APK
          path: bin/*.apk
          if-no-files-found: error
