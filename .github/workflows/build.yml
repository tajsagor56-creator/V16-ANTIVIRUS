name: Build V16 Antivirus APK

on:
  workflow_dispatch:

  push:
    branches:
      - main


concurrency:
  group: v16-antivirus-build
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 120


    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python
      # ==========================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5

        with:
          python-version: "3.11.9"


      # ==========================================
      # 3. Setup Java 17
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. Install Linux Dependencies
      # ==========================================

      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            ccache


      # ==========================================
      # 5. Setup Android SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================
      # 6. Install Android SDK Packages
      # ==========================================

      - name: Install Android SDK packages
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 7. Install Build Tools
      # ==========================================

      - name: Install Python build tools
        run: |

          python --version

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36"


      # ==========================================
      # 8. Show Environment
      # ==========================================

      - name: Show build environment
        run: |

          echo "=========================================="
          echo "V16 ANTIVIRUS BUILD ENVIRONMENT"
          echo "=========================================="

          python --version

          pip --version

          buildozer --version

          java -version

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=========================================="


      # ==========================================
      # 9. Verify buildozer.spec
      # ==========================================

      - name: Verify Buildozer configuration
        run: |

          echo "========== buildozer.spec =========="

          cat buildozer.spec

          echo "===================================="

          test -f buildozer.spec


      # ==========================================
      # 10. Clean Buildozer Cache
      # ==========================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer

          rm -rf bin


      # ==========================================
      # 11. Build APK
      # ==========================================

      - name: Build V16 APK
        env:

          P4A_URL: "https://github.com/kivy/python-for-android.git"

          P4A_COMMIT: "957a3e5"

        run: |

          buildozer -v android debug


      # ==========================================
      # 12. Find APK
      # ==========================================

      - name: Find generated APK
        run: |

          echo "=========================================="

          echo "Generated APK files:"

          find . -type f -name "*.apk" -print

          echo "=========================================="


      # ==========================================
      # 13. Verify APK
      # ==========================================

      - name: Verify APK exists
        run: |

          APK=$(find bin -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            exit 1

          fi

          echo "APK FOUND:"
          echo "$APK"


      # ==========================================
      # 14. Upload APK
      # ==========================================

      - name: Upload V16 Antivirus APK
        uses: actions/upload-artifact@v4

        with:

          name: V16-Antivirus-APK

          path: bin/*.apk

          if-no-files-found: error
